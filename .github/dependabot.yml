# Set update schedule for GitHub Actions
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    labels:
      - "pr: dependency-update"
    schedule:
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10
    # 3.1.2 bundles js-yaml 4.1.0 (GHSA-mh29-5h37-fv8m). Allow later fixed releases.
    ignore:
      - dependency-name: "cardinalby/schema-validator-action"
        versions: ["3.1.2"]
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: "pip"
    directory: "/"
    labels:
      - "pr: dependency-update"
    schedule:
      interval: weekly
      time: "06:00"
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /tools
    schedule:
      interval: daily
